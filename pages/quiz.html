<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="واجهة حل وتأدية الاختبار التفاعلي في منصة الاختبارات الجامعية.">
  <title>جلسة الاختبار | منصة الاختبارات الجامعية التفاعلية</title>

  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .quiz-layout-grid {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 900px) {
      .quiz-layout-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- Minimalist Quiz Header Bar -->
  <header class="site-header">
    <div class="container navbar">
      <div class="d-flex align-center gap-2">
        <a href="../index.html" class="brand-icon" style="text-decoration: none;" title="الرجوع للرئيسية">🎓</a>
        <div>
          <h4 id="quizMainTitle" style="margin: 0; font-size: 1.05rem;">جلسة اختبار تفاعلي</h4>
          <span id="quizCourseSubtitle" class="text-muted" style="font-size: 0.8rem;">تحميل بيانات المقرر...</span>
        </div>
      </div>

      <!-- Action items: Language Selector, Timer, Theme Toggle, Exit -->
      <div class="d-flex align-center gap-2">
        <!-- Language Switcher Segmented Control -->
        <div class="lang-segmented-control" id="quizLangControl" role="group" aria-label="لغة عرض الاختبار">
          <button type="button" class="lang-segment-btn" data-lang="ar" id="btnLangAr" title="عرض بالعربية فقط">عربي</button>
          <button type="button" class="lang-segment-btn" data-lang="en" id="btnLangEn" title="Display in English only">EN</button>
          <button type="button" class="lang-segment-btn active" data-lang="both" id="btnLangBoth" title="عرض باللغتين معاً (ثنائي)">🌐 كلاهما</button>
        </div>

        <div id="quizTimerWrapper" class="timer-badge" style="display: none;">
          <span>⏱️</span>
          <span id="quizTimerDisplay">00:00</span>
        </div>
        <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="تبديل الثيم">
          <span id="themeIcon">🌙</span>
        </button>
        <button type="button" id="btnExitQuiz" class="btn btn-ghost btn-sm" style="color: var(--danger);">
          خروج ✕
        </button>
      </div>
    </div>
  </header>

  <!-- Main Quiz Area -->
  <main class="main-content">
    <div class="container">

      <!-- Progress Bar -->
      <div class="quiz-progress-wrapper">
        <div class="progress-labels">
          <span id="quizProgressLabel">السؤال 1 من 0</span>
          <span id="quizProgressPercentage">0%</span>
        </div>
        <div class="quiz-progress-track">
          <div id="quizProgressBar" class="quiz-progress-fill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Main Layout: Question Area + Palette Sidebar -->
      <div class="quiz-layout-grid">

        <!-- Left: Current Question Area -->
        <div class="quiz-primary-column">

          <!-- Question Box Container -->
          <div class="question-container" id="questionCard">
            <div class="question-header">
              <span class="question-number" id="questionNumberBadge">سؤال #1</span>
              <div class="d-flex gap-1" id="questionTags">
                <span class="badge badge-primary" id="questionTypeBadge">اختيار من متعدد</span>
                <span class="badge badge-neutral" id="questionDifficultyBadge">متوسط</span>
              </div>
            </div>

            <!-- Question Text -->
            <div class="question-text" id="questionText">
              جاري تجهيز وتحميل السؤال...
            </div>

            <!-- Options Container -->
            <div class="options-list" id="optionsContainer">
              <!-- Dynamically populated options -->
            </div>

            <!-- Instant Feedback / Check Answer Area -->
            <div id="instantFeedbackBox" class="instant-feedback-box" style="display: none;"></div>
          </div>

          <!-- Controls: Prev, Check Answer, Next, Submit -->
          <div class="quiz-controls">
            <button type="button" id="btnPrevQuestion" class="btn btn-secondary" disabled>
              → السؤال السابق
            </button>
            <div class="d-flex gap-1 align-center flex-wrap">
              <button type="button" id="btnCheckAnswer" class="btn btn-outline" style="border-color: var(--primary-500); color: var(--primary-600); font-weight: 700;">
                💡 تحقق من الإجابة
              </button>
              <button type="button" id="btnNextQuestion" class="btn btn-primary">
                السؤال التالي ←
              </button>
              <button type="button" id="btnSubmitQuiz" class="btn btn-success" style="display: none;">
                ✓ تسليم الاختبار
              </button>
            </div>
          </div>

        </div>

        <!-- Right: Question Palette / Map -->
        <aside class="palette-card">
          <div class="d-flex align-center justify-between mb-2">
            <h4 style="margin: 0; font-size: 0.95rem;">خريطة الأسئلة</h4>
            <span id="answeredCountBadge" class="badge badge-neutral">0 مجاب</span>
          </div>
          <p class="text-muted" style="font-size: 0.78rem; margin-bottom: 0.75rem;">
            انقر على أي رقم للانتقال المباشر للسؤال.
          </p>
          <div class="palette-grid" id="paletteGrid">
            <!-- Dynamically populated buttons -->
          </div>
          <div class="mt-3 pt-2"
            style="border-top: 1px solid var(--border-subtle); font-size: 0.75rem; color: var(--text-muted);">
            <div class="d-flex align-center gap-1 mb-1">
              <span style="width: 12px; height: 12px; background: var(--primary-500); border-radius: 2px;"></span>
              <span>سؤال تمت الإجابة عنه</span>
            </div>
            <div class="d-flex align-center gap-1">
              <span style="width: 12px; height: 12px; border: 2px solid var(--warning); border-radius: 2px;"></span>
              <span>السؤال الحالي</span>
            </div>
          </div>
        </aside>

      </div>

    </div>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/static-data.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/quiz.js"></script>
</body>

</html>
